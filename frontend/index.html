<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08121f">
  <title>CareVault | Patient Case Taking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-orb orb1"></div><div class="bg-orb orb2"></div>
  <section id="loginScreen" class="login-screen">
    <div class="login-card glass animate-up">
      <div class="brand"><div class="brand-icon">✚</div><div><b>CareVault</b><span>Clinical Case-Taking</span></div></div>
      <span class="eyebrow">SECURE HEALTH WORKSPACE</span>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to securely manage structured patient case records.</p>
      <form id="loginForm">
        <label>Staff ID<input id="loginStaffId" inputmode="numeric" autocomplete="username" placeholder="Enter registered staff ID" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required></label>
        <label>Captcha<input id="loginCaptcha" autocomplete="off" placeholder="Enter captcha" maxlength="5" required></label>
        <div class="captcha-box"><strong id="captchaValue"></strong><button type="button" class="text-btn" id="refreshCaptcha">↻ Refresh</button></div>
        <button class="btn primary full" type="submit">Login</button>
        <button type="button" class="text-btn" id="forgotPassword">Forgot password?</button>
      </form>
      <div class="security-note">🔐 Password hashing · Encrypted patient records · Role-based access</div>
    </div>
  </section>

  <section id="appScreen" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">✚</div><div><b>CareVault</b><span>Clinical Workspace</span></div></div>
      <nav>
        <button class="nav-btn active" data-page="dashboard">⌂ Dashboard</button>
        <button class="nav-btn" data-page="patients">◉ Patients</button>
        <button class="nav-btn" data-page="new">＋ New Case</button>
        <button class="nav-btn" data-page="reminders">⏰ Reminders</button>
        <button class="nav-btn admin-only hidden" data-page="doctors">♙ Doctors</button>
        <button class="nav-btn admin-only hidden" data-page="audit">◌ Audit Log</button>
      </nav>
      <div class="sidebar-user">
        <b id="userName"></b><span id="userRole"></span>
        <button id="logoutBtn" class="logout">↪ Sign out</button>
      </div>
    </aside>
    <main class="main">
      <div id="page"></div>
    </main>
  </section>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
